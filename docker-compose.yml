services:
  db:
    image: postgres:15
    container_name: crypto_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: crypto
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pipeline:
    build: .
    container_name: crypto_pipeline
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_NAME: crypto
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_PORT: 5432

  dashboard:
    build: .
    container_name: crypto_dashboard
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_NAME: crypto
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_PORT: 5432
    ports:
      - "8501:8501"
    command: streamlit run dashboard.py --server.address=0.0.0.0 --server.port=8501

volumes:
  postgres_data: