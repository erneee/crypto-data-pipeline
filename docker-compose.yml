services:
  db:
    image: postgres:15
    container_name: crypto_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: crypto
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pipeline:
    build: .
    container_name: crypto_pipeline
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_NAME: crypto
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_PORT: 5432

volumes:
  postgres_data: